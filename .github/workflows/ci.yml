name: CI Pipeline (PR Validation)

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# Cancelar ejecuciones previas de la misma PR si se envían nuevos commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Validación de Formato de Código (gofmt)
  # =========================================================================
  lint:
    name: Code Quality & Formatting (gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Verify Formatting with gofmt
        run: |
          echo "🔍 Verificando formato de código con gofmt..."
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Los siguientes archivos no cumplen con el formato estándar de gofmt:"
            echo "$UNFORMATTED"
            echo ""
            echo "💡 Ejecuta 'go fmt ./...' localmente y sube los cambios para corregirlo."
            exit 1
          fi
          echo "✅ Todos los archivos Go cumplen estrictamente con gofmt."

  # =========================================================================
  # 2. Pruebas Unitarias con Race Detector (-race)
  # =========================================================================
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout 5m -coverprofile=coverage.out ./...

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # =========================================================================
  # 3. Simulacro de Compilación Multiplataforma (Dry-run Build)
  # =========================================================================
  build-dry-run:
    name: Cross-Compilation Dry Run
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Verify Compilation Across Targets
        run: |
          echo "🔨 Verificando compilabilidad de todos los paquetes..."
          go build -v ./...

          echo "🔨 Simulando compilación: Linux amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/downloader || GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/godownloader

          echo "🔨 Simulando compilación: macOS arm64..."
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/downloader || GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/godownloader

          echo "🔨 Simulando compilación: Windows amd64..."
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/downloader || GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/godownloader

          echo "✅ Simulacro de compilación completado con éxito (0 artefactos publicados)."
