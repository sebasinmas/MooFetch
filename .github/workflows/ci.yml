name: CI Pipeline (PR Validation)

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# Cancelar ejecuciones previas de la misma PR si se envían nuevos commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Validación de Formato de Código (gofmt)
  # =========================================================================
  lint:
    name: Code Quality & Formatting (gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Verify Formatting with gofmt
        run: |
          echo "🔍 Verificando formato de código con gofmt..."
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Los siguientes archivos no cumplen con el formato estándar de gofmt:"
            echo "$UNFORMATTED"
            echo ""
            echo "💡 Ejecuta 'go fmt ./...' localmente y sube los cambios para corregirlo."
            exit 1
          fi
          echo "✅ Todos los archivos Go cumplen estrictamente con gofmt."

  # =========================================================================
  # 1b. Análisis estático (golangci-lint, config en .golangci.yml)
  # =========================================================================
  golangci-lint:
    name: Static Analysis (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      # .golangci.yml usa `version: "2"`: requiere action v7+ y golangci-lint v2.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5

  # =========================================================================
  # 1c. Trazabilidad: docs/traceability.md debe estar al día con el JSON
  # =========================================================================
  traceability:
    name: Traceability Table Up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Check docs/traceability.md
        run: go run scripts/gen-traceability.go -check

  # =========================================================================
  # 1d. Validación de la configuración de GoReleaser (sin publicar nada)
  # =========================================================================
  goreleaser-check:
    name: GoReleaser Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # =========================================================================
  # 2. Pruebas Unitarias con Race Detector (-race)
  # =========================================================================
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout 5m -coverprofile=coverage.out ./...

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # =========================================================================
  # 3. Simulacro de Compilación Multiplataforma (Dry-run Build)
  # =========================================================================
  build-dry-run:
    name: Cross-Compilation Dry Run
    runs-on: ubuntu-latest
    needs: [lint, golangci-lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Verify Compilation Across Targets
        run: |
          echo "🔨 Verificando compilabilidad de todos los paquetes..."
          go build -v ./...

          echo "🔨 Simulando compilación: Linux amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/moofetch

          echo "🔨 Simulando compilación: macOS arm64..."
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/moofetch

          echo "🔨 Simulando compilación: Windows amd64..."
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/moofetch

          echo "✅ Simulacro de compilación completado con éxito (0 artefactos publicados)."
