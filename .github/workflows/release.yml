name: CD Pipeline (GoReleaser Tagged Release)

on:
  push:
    tags:
      - "v*" # Disparo restringido exclusivamente a tags oficiales de versión (ej. v1.2.0)

permissions:
  contents: write # Permiso necesario para crear la Release en GitHub y subir los binarios generados

jobs:
  goreleaser:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full Git History)
        uses: actions/checkout@v4
        with:
          # Esencial: GoReleaser compara el tag actual con el anterior ({{ .PreviousTag }})
          # para generar los patchnotes; con un clone superficial el changelog saldría
          # vacío o con todo el historial.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # go 1.24.x declarado en go.mod: una sola fuente de verdad
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
