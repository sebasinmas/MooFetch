# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# ==============================================================================
# GoReleaser v2 - Configuración de Release y Compilación Multiplataforma
# Proyecto: MooFetch
# ==============================================================================
version: 2

project_name: moofetch

before:
  hooks:
    - go mod tidy

builds:
  - id: moofetch
    # Entrypoint de la CLI
    main: ./cmd/moofetch
    binary: moofetch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

    # Inyección de metadatos en tiempo de compilación mediante LDFLAGS.
    # Esta es la "Única Fuente de la Verdad", inyectando el Tag Git, Commit y Fecha.
    ldflags:
      - -s -w
      # El comando reside en package main
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.BuildDate={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "🚀 Nuevas Características"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: "🐛 Corrección de Errores"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: "⚡ Rendimiento"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 300
    - title: "🔄 Refactorización & Arquitectura"
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: "Otros Cambios"
      order: 999

release:
  github:
    owner: sebasinmas
    name: MooFetch
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Release {{ .Tag }} ({{ .Date }})
    Distribución oficial de **MooFetch**. Binarios precompilados disponibles a continuación.
